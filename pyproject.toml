[project]
name = "taming-agent-sprawl"
version = "0.1.0"
description = "Workshop material: evaluating agentic systems beyond the framework's own tests"
requires-python = ">=3.13"
dependencies = [
    "langsmith-agent-lifecycle-workshop",
    "python-dotenv>=1.2.2",
    "opentelemetry-sdk>=1.30.0",
    "openinference-instrumentation-langchain>=0.1.70",
    "opentelemetry-exporter-otlp-proto-common>=1.45.1",
    "protobuf>=6.33.6",
]

[tool.uv]
package = false

[tool.uv.sources]
langsmith-agent-lifecycle-workshop = { path = "systems/techhub", editable = true }
